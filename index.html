<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Selamat Ulang Tahun, Mufirza 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --pink-pastel: #f9d7e3;
      --pink-soft: #fce8ef;
      --pink-mid: #f2a8c4;
      --pink-deep: #e07fa8;
      --cream: #fff8ef;
      --cream-deep: #fbeedd;
      --gold: #cda45e;
      --gold-light: #e8c98a;
      --gold-deep: #a9793a;
      --white-flower: #fffdfa;
      --ink: #6b4a52;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at 15% 20%, #fdeef4 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, #fdf3e4 0%, transparent 45%),
        linear-gradient(160deg, var(--cream) 0%, var(--pink-soft) 50%, var(--cream-deep) 100%);
      overflow-x: hidden;
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 14px 60px;
      overflow: hidden;
    }

    /* ---------- Sparkles & floating gold specks ---------- */
    .sparkle-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      color: var(--gold);
      opacity: 0;
      animation: twinkle 3.2s ease-in-out infinite;
      filter: drop-shadow(0 0 3px rgba(205, 164, 94, 0.55));
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0;
        transform: scale(0.4) rotate(0deg);
      }

      50% {
        opacity: 1;
        transform: scale(1) rotate(90deg);
      }
    }

    .petal {
      position: absolute;
      top: -40px;
      font-size: 16px;
      opacity: 0.85;
      animation: fallPetal linear infinite;
      pointer-events: none;
    }

    @keyframes fallPetal {
      0% {
        transform: translateY(-5vh) translateX(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.9;
      }

      90% {
        opacity: 0.7;
      }

      100% {
        transform: translateY(105vh) translateX(30px) rotate(340deg);
        opacity: 0;
      }
    }

    /* ---------- Card container ---------- */
    .card-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      perspective: 1800px;
    }

    /* ===== COVER ===== */
    .cover {
      position: relative;
      background:
        linear-gradient(180deg, var(--cream) 0%, var(--pink-soft) 100%);
      border-radius: 22px;
      padding: 26px 20px 28px;
      box-shadow: 0 18px 40px -12px rgba(160, 90, 120, 0.35), 0 0 0 1px rgba(205, 164, 94, 0.25) inset;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transform-origin: center left;
      transition: transform 0.9s cubic-bezier(.55, .06, .28, .99), opacity 0.7s ease, box-shadow 0.6s ease;
      overflow: hidden;
    }

    .cover.opened {
      transform: rotateY(-140deg) scale(0.92);
      opacity: 0;
      pointer-events: none;
      box-shadow: none;
    }

    .cover-border {
      position: absolute;
      inset: 8px;
      border: 1.5px solid var(--gold-light);
      border-radius: 16px;
      pointer-events: none;
    }

    .cover-border::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(205, 164, 94, 0.45);
      border-radius: 12px;
    }

    .corner-flower {
      position: absolute;
      font-size: 22px;
      line-height: 1;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.06));
    }

    .corner-flower.tl {
      top: 14px;
      left: 14px;
    }

    .corner-flower.tr {
      top: 14px;
      right: 14px;
      transform: scaleX(-1);
    }

    .corner-flower.bl {
      bottom: 14px;
      left: 14px;
      transform: scaleY(-1);
    }

    .corner-flower.br {
      bottom: 14px;
      right: 14px;
      transform: scale(-1, -1);
    }

    .cover-title {
      font-family: 'Great Vibes', cursive;
      font-size: 38px;
      line-height: 1.25;
      background: linear-gradient(100deg, var(--gold-deep), var(--gold-light) 40%, var(--gold-deep) 70%, var(--gold-light));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 18px 0 6px;
      padding: 0 4px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .cover-sub {
      font-family: 'Dancing Script', cursive;
      font-size: 17px;
      color: var(--pink-deep);
      margin-bottom: 16px;
      letter-spacing: 0.3px;
    }

    .photo-frame {
      position: relative;
      width: 78%;
      margin: 6px auto 14px;
      padding: 8px;
      background: linear-gradient(145deg, #fffefb, #fbeedd);
      border: 2px solid var(--gold-light);
      border-radius: 14px;
      box-shadow: 0 8px 18px -8px rgba(160, 90, 120, 0.4), 0 0 0 5px rgba(255, 255, 255, 0.6) inset;
    }

    .photo-frame img {
      display: block;
      width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(205, 164, 94, 0.35);
    }

    .photo-frame .tape {
      position: absolute;
      width: 46px;
      height: 18px;
      background: rgba(242, 168, 196, 0.55);
      border: 1px solid rgba(224, 127, 168, 0.4);
      top: -10px;
    }

    .photo-frame .tape.left {
      left: -8px;
      transform: rotate(-18deg);
    }

    .photo-frame .tape.right {
      right: -8px;
      transform: rotate(18deg);
    }

    .tap-hint {
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--gold-deep);
      letter-spacing: 0.5px;
      opacity: 0.85;
      animation: pulseHint 1.8s ease-in-out infinite;
    }

    @keyframes pulseHint {

      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }

    .heart-seal {
      width: 52px;
      height: 52px;
      margin: 6px auto 2px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold-deep));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px -3px rgba(169, 121, 58, 0.6);
      animation: seal-breathe 2.6s ease-in-out infinite;
    }

    @keyframes seal-breathe {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    /* ===== LETTER (inside) ===== */
    .letter {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--cream) 0%, #fff 55%, var(--pink-soft) 100%);
      border-radius: 22px;
      padding: 26px 20px 30px;
      box-shadow: 0 18px 40px -12px rgba(160, 90, 120, 0.35), 0 0 0 1px rgba(205, 164, 94, 0.25) inset;
      opacity: 0;
      transform: scale(0.94);
      pointer-events: none;
      transition: opacity 0.7s ease 0.35s, transform 0.7s ease 0.35s;
      overflow: hidden;
    }

    .letter.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .ribbon {
      position: absolute;
      top: -6px;
      right: 16px;
      width: 46px;
      z-index: 5;
      filter: drop-shadow(0 3px 4px rgba(160, 90, 120, 0.35));
    }

    .letter-photo {
      width: 64%;
      margin: 6px auto 14px;
      padding: 6px;
      background: #fffefb;
      border: 2px solid var(--gold-light);
      border-radius: 50%;
      box-shadow: 0 6px 14px -6px rgba(160, 90, 120, 0.4);
    }

    .letter-photo img {
      display: block;
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid rgba(205, 164, 94, 0.35);
    }

    .letter-heading {
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-size: 24px;
      color: var(--pink-deep);
      margin: 0 0 14px;
    }

    .message-box {
      font-family: 'Poppins', sans-serif;
      font-size: 13.6px;
      line-height: 1.85;
      color: #5b4048;
      text-align: left;
      padding: 0 2px;
    }

    .msg-line {
      opacity: 0;
      transform: translateY(6px);
      animation: lineIn 0.7s ease forwards;
    }

    @keyframes lineIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .signature {
      margin-top: 16px;
      text-align: right;
      font-family: 'Great Vibes', cursive;
      font-size: 24px;
      color: var(--gold-deep);
      opacity: 0;
      animation: lineIn 0.9s ease forwards;
    }

    .footer {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0;
      animation: lineIn 0.9s ease forwards;
    }

    .footer-date {
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      font-size: 22px;
      background: linear-gradient(100deg, var(--gold-deep), var(--gold-light) 50%, var(--gold-deep));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .footer-zodiac {
      font-size: 20px;
      color: var(--gold-deep);
    }

    .footer-note {
      text-align: center;
      font-size: 10.5px;
      color: var(--pink-deep);
      opacity: 0;
      margin-top: 2px;
      letter-spacing: 0.4px;
      animation: lineIn 0.9s ease forwards;
    }

    .close-btn {
      display: block;
      margin: 16px auto 0;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--pink-deep);
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--pink-mid);
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      opacity: 0;
      animation: lineIn 0.9s ease forwards;
    }

    .close-btn:active {
      transform: scale(0.96);
    }

    .small-flower-row {
      text-align: center;
      font-size: 13px;
      letter-spacing: 6px;
      color: var(--pink-mid);
      margin-top: 4px;
    }

    @media (max-width:360px) {
      .cover-title {
        font-size: 32px;
      }

      .letter-heading {
        font-size: 21px;
      }

      .message-box {
        font-size: 12.8px;
      }
    }
  </style>
</head>

            alt="Kenangan bersama">
        </div>

        <div class="letter-heading">Untuk Abang tersayang 💌</div>

        <div class="message-box" id="messageBox"></div>

        <div class="signature" id="signature" style="animation-delay:0.2s">Dari seorang pengagum kamu ✨</div>

        <div class="small-flower-row"
          style="margin-top:14px; opacity:0; animation:lineIn 0.9s ease forwards; animation-delay:0.3s">✿ ❀ ✿</div>

        <div class="footer" id="footer" style="animation-delay:0.4s">
          <span class="footer-date">29 Juli</span>
          <span class="footer-zodiac">♌</span>
        </div>
        <div class="footer-note" id="footerNote" style="animation-delay:0.5s">— hari lahirnya Abang, sang Leo —</div>

        <button class="close-btn" id="closeBtn" style="animation-delay:0.6s">↩ tutup kartu</button>
      </div>

    </div>
  </div>

  <script>
    // ---------- Sparkles ----------
    const sparkleLayer = document.getElementById('sparkleLayer');
    const sparkleGlyphs = ['✦', '✧', '⋆', '✨'];
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = sparkleGlyphs[Math.floor(Math.random() * sparkleGlyphs.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.fontSize = (10 + Math.random() * 12) + 'px';
      s.style.animationDelay = (Math.random() * 3.2) + 's';
      s.style.animationDuration = (2.4 + Math.random() * 2.4) + 's';
      sparkleLayer.appendChild(s);
    }
    // ---------- Falling petals ----------
    const petalGlyphs = ['🌸', '🌷', '❀', '✿'];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = petalGlyphs[Math.floor(Math.random() * petalGlyphs.length)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.fontSize = (12 + Math.random() * 10) + 'px';
      p.style.animationDuration = (7 + Math.random() * 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      sparkleLayer.appendChild(p);
    }

    // ---------- Card open/close ----------
    const cover = document.getElementById('cover');
    const letter = document.getElementById('letter');
    const closeBtn = document.getElementById('closeBtn');
    const messageBox = document.getElementById('messageBox');

    const fullMessage = "Abang, tepat tanggal 29 Juli adalah hari yang sangat spesial, ditanggal tersebut abang dilahirkan oleh ibunya abang. Aku bersyukur bisa mengenal abang dihidup yang singkat ini dan masa depan gak ada yang tau kan. Semoga semua impian dan harapan abang terwujud ditahun ini dan tahun-tahun mendatang, serta semoga oneday Allah ngasih takdir terbaik buat dua anak manusia ini. Selamat ulang tahun abang, love u more time!! 💕";

    let messageBuilt = false;

    function buildMessage() {
      if (messageBuilt) return;
      messageBuilt = true;
      const sentences = fullMessage.match(/[^.!]+[.!]+|\S+$/g) || [fullMessage];
      let delay = 0.1;
      sentences.forEach((sentence) => {
        const div = document.createElement('div');
        div.className = 'msg-line';
        div.style.animationDelay = delay.toFixed(2) + 's';
        div.style.marginBottom = '10px';
        div.textContent = sentence.trim();
        messageBox.appendChild(div);
        delay += 0.55;
      });
      // push signature/footer delay after message finishes
      const afterDelay = delay + 0.15;
      document.getElementById('signature').style.animationDelay = afterDelay.toFixed(2) + 's';
      document.getElementById('footer').style.animationDelay = (afterDelay + 0.25).toFixed(2) + 's';
      document.getElementById('footerNote').style.animationDelay = (afterDelay + 0.4).toFixed(2) + 's';
      document.querySelector('.letter .small-flower-row').style.animationDelay = (afterDelay + 0.1).toFixed(2) + 's';
      closeBtn.style.animationDelay = (afterDelay + 0.55).toFixed(2) + 's';
    }

    cover.addEventListener('click', () => {
      cover.classList.add('opened');
      setTimeout(() => {
        letter.classList.add('show');
        buildMessage();
      }, 380);
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      letter.classList.remove('show');
      setTimeout(() => {
        cover.classList.remove('opened');
      }, 250);
    });
  </script>
